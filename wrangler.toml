name = "atiendeme-la-pyme"
main = "src/index.js"
compatibility_date = "2024-01-01"

# App ID de Meta ("Atiéndeme la pyme") — no es secreto, se usa igual en el
# diálogo de OAuth del lado del cliente. El App Secret sí es secreto
# (wrangler secret put META_APP_SECRET).
[vars]
META_APP_ID = "4305884926391021"
INSTAGRAM_APP_ID = "2244834902982613"
# ID de la configuracion de "Facebook Login for Business" (Casos de uso >
# Inicio de sesion con Facebook para empresas > Configuraciones). No es
# secreto -- se usa igual en la URL del dialogo de OAuth del lado del
# cliente. Variante "Token de acceso de usuario", permisos: pages_show_list,
# pages_messaging, pages_manage_metadata, business_management,
# whatsapp_business_management, whatsapp_business_messaging (+ whatsapp sin
# usar todavia). "Production Config" (9 sept 2026) -- reemplaza a la
# config anterior (id 1096469376260304, "App Review Test Config"), que
# quedo con un permiso fantasma "instagram_manage_comments" (deprecado)
# pegado a sus datos guardados y que la UI de Meta no permitia purgar via
# checkboxes, causando "Invalid Scopes: instagram_manage_comments" en el
# connect de Facebook Page. La config vieja se dejo sin usar, no se borro.
META_LOGIN_CONFIG_ID = "1482045480428287"
# Rate Limiting nativo de Cloudflare (ver limitRequest en src/lib/rateLimit.js).
# Período solo 10 o 60 segundos. namespace_id es un identificador propio.
[[ratelimits]]
name = "RL_BURST"
namespace_id = "1001"
simple = { limit = 5, period = 10 }

[[ratelimits]]
name = "RL_MINUTE"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "71b78676d0a74b47bac411a8782e5184"
preview_id = "71b78676d0a74b47bac411a8782e5184"

[[migrations]]
tag = "v1-plantest"
new_sqlite_classes = ["PlanTest"]

[[migrations]]
tag = "v2-remove-plantest"
deleted_classes = ["PlanTest"]

[[migrations]]
tag = "v3-chatroom"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v4-message-buffer"
new_sqlite_classes = ["MessageBuffer"]

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# Junta los mensajes seguidos de una persona en Instagram/Messenger antes de responder.
[[durable_objects.bindings]]
name = "MESSAGE_BUFFER"
class_name = "MessageBuffer"

[triggers]
crons = ["0 13 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
